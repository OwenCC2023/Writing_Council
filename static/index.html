<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Council</title>
<style>
  :root {
    --bg:        #1a1a1a;
    --bg-raised: #242424;
    --bg-input:  #2c2c2c;
    --border:    #444;
    --text:      #ddd;
    --text-muted:#888;
    --tab-idle:  #2c2c2c;
    --btn-run:   #c8b89a;
    --btn-run-fg:#1a1a1a;
    --btn-dl:    #3a7a5e;
    --warn-bg:   #2a2500;
    --warn-bdr:  #7a6200;
    --err-bg:    #2a1010;
    --err-bdr:   #7a3030;
    --err-fg:    #e88;
  }
  .light {
    --bg:        #f5f0eb;
    --bg-raised: #fff;
    --bg-input:  #fff;
    --border:    #bbb;
    --text:      #222;
    --text-muted:#666;
    --tab-idle:  #e8e0d8;
    --btn-run:   #3a3a3a;
    --btn-run-fg:#fff;
    --btn-dl:    #2a6049;
    --warn-bg:   #fff8e1;
    --warn-bdr:  #f0c040;
    --err-bg:    #fdecea;
    --err-bdr:   #e57373;
    --err-fg:    #c0392b;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Georgia, serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
  .container { max-width: 780px; margin: 0 auto; }
  .header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.6rem; margin: 0; }
  #theme-toggle {
    margin-left: auto; padding: 0.25rem 0.7rem; font-size: 0.8rem;
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; cursor: pointer; font-family: inherit;
  }
  label { display: block; font-weight: bold; margin-top: 1rem; margin-bottom: 0.25rem; font-size: 0.9rem; }
  input[type="text"], textarea {
    width: 100%; padding: 0.5rem; font-family: inherit; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--bg-input); color: var(--text);
  }
  textarea { resize: vertical; min-height: 100px; }
  .optional { font-weight: normal; color: var(--text-muted); font-size: 0.8rem; margin-left: 0.4rem; }
  .tabs { display: flex; margin-top: 1rem; }
  .tab-btn {
    padding: 0.4rem 1rem; border: 1px solid var(--border); background: var(--tab-idle);
    color: var(--text); cursor: pointer; font-size: 0.9rem; border-radius: 3px 3px 0 0;
    font-family: inherit;
  }
  .tab-btn.active { background: var(--bg-input); border-bottom-color: var(--bg-input); }
  .tab-panel { border: 1px solid var(--border); padding: 0.75rem; background: var(--bg-input); border-radius: 0 3px 3px 3px; }
  input[type="file"] { color: var(--text); }
  .hidden { display: none !important; }
  [hidden] { display: none !important; }
  .story-chip {
    display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem;
    padding: 0.25rem 0.5rem; font-size: 0.85rem; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg-input); color: var(--text);
  }
  .chip-remove {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--err-bdr);
    background: var(--err-bg); color: var(--err-fg); cursor: pointer; font-size: 0.75rem;
    line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
    font-family: inherit;
  }
  .mode-option { display: block; font-weight: normal; margin-top: 0.4rem; font-size: 0.9rem; }
  .mode-option input { margin-right: 0.4rem; }
  #intake_brief { margin-bottom: 0.75rem; }
  #intake_brief summary { cursor: pointer; font-size: 0.9rem; font-weight: bold; }
  #intake_brief pre {
    white-space: pre-wrap; font-family: inherit; font-size: 0.85rem; margin: 0.5rem 0 0;
    padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 3px;
    background: var(--bg-input); color: var(--text);
  }
  button[type="submit"] {
    margin-top: 1.5rem; padding: 0.6rem 1.4rem; font-size: 1rem;
    background: var(--btn-run); color: var(--btn-run-fg); border: none; border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }
  #download-btn {
    display: block; margin-top: 0.75rem; padding: 0.6rem 1.4rem; font-size: 1rem;
    background: var(--btn-dl); color: #fff; border: none; border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  #spinner { margin-top: 1.5rem; font-style: italic; color: var(--text-muted); }
  #output-section { margin-top: 2rem; }
  #output-section h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  #story-output {
    width: 100%; min-height: 400px; font-family: "Times New Roman", serif;
    font-size: 0.95rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 3px;
    background: var(--bg-input); color: var(--text);
  }
  .warning {
    background: var(--warn-bg); border: 1px solid var(--warn-bdr); padding: 0.5rem 0.75rem;
    border-radius: 3px; font-size: 0.85rem; margin-top: 0.75rem; color: var(--text);
  }
  #error-msg {
    margin-top: 1rem; color: var(--err-fg); background: var(--err-bg);
    border: 1px solid var(--err-bdr); padding: 0.5rem 0.75rem; border-radius: 3px; font-size: 0.9rem;
  }
  .cc-pass, .cc-fail {
    padding: 0.5rem 0.75rem; border-radius: 3px; font-size: 0.85rem; margin-bottom: 0.75rem;
    border: 1px solid;
  }
  .cc-pass { color: var(--text); background: var(--warn-bg); border-color: var(--warn-bdr); }
  .cc-fail { color: var(--err-fg); background: var(--err-bg); border-color: var(--err-bdr); }
  .thumb-strip {
    display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.6rem;
  }
  .thumb {
    position: relative; width: 84px;
  }
  .thumb img {
    width: 84px; height: 84px; object-fit: cover; border: 1px solid var(--border);
    border-radius: 3px; display: block; background: var(--bg-input);
  }
  .thumb-name {
    font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-remove {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; border: 1px solid var(--err-bdr); background: var(--err-bg);
    color: var(--err-fg); cursor: pointer; font-size: 0.75rem; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
    font-family: inherit;
  }
  #remove-all-btn {
    margin-top: 0.6rem; padding: 0.3rem 0.7rem; font-size: 0.8rem;
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Writing Council</h1>
    <button type="button" id="theme-toggle">Light mode</button>
  </div>

  <form id="council-form" novalidate>
    <label for="title" id="label_title">Title *</label>
    <input type="text" id="title" name="title" required>

    <label for="author" id="label_author">Author *</label>
    <input type="text" id="author" name="author" required>

    <label for="story_file">Rewrite an existing story <span class="optional">(optional)</span></label>
    <input type="file" id="story_file" accept=".txt,.md,.docx">
    <div class="story-chip hidden" id="story_chip">
      <span id="story_name"></span>
      <button type="button" id="story_remove" class="chip-remove" aria-label="Remove story">&times;</button>
    </div>
    <div id="rewrite_controls" hidden>
      <label>Rewrite mode</label>
      <label class="mode-option">
        <input type="radio" name="rewrite_mode" value="reimagine" checked>
        Reimagine &mdash; a new story on the original&rsquo;s bones
      </label>
      <label class="mode-option">
        <input type="radio" name="rewrite_mode" value="revise">
        Revise &mdash; edit the original prose
      </label>
      <label for="rewrite_notes">Rewrite Notes <span class="optional">(optional)</span></label>
      <textarea id="rewrite_notes" name="rewrite_notes" rows="3"
                placeholder="e.g. darker ending · cut the flashback · keep the narrator"></textarea>
    </div>

    <label for="idea" id="label_idea">Idea *</label>
    <textarea id="idea" name="idea" rows="5" required></textarea>

    <label for="target_length" id="label_target_length">Target Length *</label>
    <input type="text" id="target_length" name="target_length" value="8,000 words" required>

    <label for="target_audience" id="label_target_audience">Target Audience *</label>
    <input type="text" id="target_audience" name="target_audience" value="Adult sci-fi readers" required>

    <label for="world_rules">World Rules <span class="optional">(optional)</span></label>
    <textarea id="world_rules" name="world_rules" rows="4"></textarea>

    <label for="framework">Framework <span class="optional">(optional)</span></label>
    <input type="text" id="framework" name="framework" value="Short Story">

    <label for="style_field">Style <span class="optional">(optional)</span></label>
    <input type="text" id="style_field" name="style_field">

    <label for="world_class">World class</label>
    <select id="world_class" name="world_class">
      <option value="auto" selected>Auto &mdash; let the planner decide</option>
      <option value="EARTH">Earth &mdash; contemporary or familiar-historical</option>
      <option value="SECONDARY">Secondary &mdash; magic in a real city, alt-history, near-future</option>
      <option value="NON-EARTH">Non-Earth &mdash; another planet, far future, deep past (3&ndash;5&times; cost)</option>
    </select>

    <label for="constraint">Constraint <span class="optional">(optional)</span></label>
    <input type="text" id="constraint" name="constraint"
           placeholder="e.g. exactly 200 words · forbidden words: love, death · told as an obituary">

    <label>Image <span class="optional">(optional)</span></label>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-upload">Upload</button>
      <button type="button" class="tab-btn" id="tab-url">URL</button>
    </div>
    <div class="tab-panel">
      <div id="panel-upload">
        <input type="file" id="image_file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
        <div class="thumb-strip hidden" id="thumb-strip"></div>
        <button type="button" id="remove-all-btn" class="hidden">Remove all</button>
      </div>
      <div id="panel-url" class="hidden">
        <input type="text" id="image_url" placeholder="https://example.com/image.png">
      </div>
    </div>

    <button type="submit" id="run-btn">Run Council</button>
  </form>

  <div id="spinner" class="hidden">&#8635; Council is working&hellip; (this may take several minutes)</div>
  <div id="error-msg" class="hidden"></div>

  <div id="output-section" class="hidden">
    <h2>Output</h2>
    <div id="constraint-check" class="hidden"></div>
    <details id="intake_brief" class="hidden">
      <summary>Story brief</summary>
      <pre id="intake_brief_text"></pre>
    </details>
    <textarea id="story-output" readonly></textarea>
    <div class="warning">&#9888; Output is not saved &mdash; download before closing this tab.</div>
    <button type="button" id="download-btn">Download .docx</button>
  </div>
</div>

<script>
  // --- Theme ---
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(light) {
    document.body.classList.toggle('light', light);
    themeBtn.textContent = light ? 'Dark mode' : 'Light mode';
    localStorage.setItem('wc-theme', light ? 'light' : 'dark');
  }
  applyTheme(localStorage.getItem('wc-theme') === 'light');
  themeBtn.addEventListener('click', () => applyTheme(!document.body.classList.contains('light')));

  const form         = document.getElementById('council-form');
  const runBtn       = document.getElementById('run-btn');
  const spinner      = document.getElementById('spinner');
  const errorMsg     = document.getElementById('error-msg');
  const outputSection = document.getElementById('output-section');
  const storyOutput  = document.getElementById('story-output');
  const downloadBtn  = document.getElementById('download-btn');
  const tabUpload    = document.getElementById('tab-upload');
  const tabUrl       = document.getElementById('tab-url');
  const panelUpload  = document.getElementById('panel-upload');
  const panelUrl     = document.getElementById('panel-url');
  const imageInput   = document.getElementById('image_file');
  const thumbStrip   = document.getElementById('thumb-strip');
  const removeAllBtn = document.getElementById('remove-all-btn');

  // --- Uploaded photos (multi-file, removable before submit) ---
  let uploadedPhotos = []; // array of File objects
  let thumbUrls = [];      // parallel array of object URLs, for cleanup

  function renderThumbs() {
    thumbUrls.forEach(u => URL.revokeObjectURL(u));
    thumbUrls = uploadedPhotos.map(f => URL.createObjectURL(f));
    thumbStrip.innerHTML = '';
    uploadedPhotos.forEach((file, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const img = document.createElement('img');
      img.src = thumbUrls[i];
      img.alt = file.name;
      thumb.appendChild(img);

      const name = document.createElement('div');
      name.className = 'thumb-name';
      name.textContent = file.name;
      thumb.appendChild(name);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'thumb-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Remove ' + file.name);
      removeBtn.addEventListener('click', () => {
        uploadedPhotos.splice(i, 1);
        renderThumbs();
      });
      thumb.appendChild(removeBtn);

      thumbStrip.appendChild(thumb);
    });
    thumbStrip.classList.toggle('hidden', uploadedPhotos.length === 0);
    removeAllBtn.classList.toggle('hidden', uploadedPhotos.length === 0);
  }

  function isDuplicate(file) {
    return uploadedPhotos.some(f =>
      f.name === file.name && f.size === file.size && f.lastModified === file.lastModified
    );
  }

  imageInput.addEventListener('change', () => {
    for (const file of imageInput.files) {
      if (!isDuplicate(file)) uploadedPhotos.push(file);
    }
    imageInput.value = ''; // allow re-adding a removed file
    renderThumbs();
  });

  removeAllBtn.addEventListener('click', () => {
    uploadedPhotos = [];
    renderThumbs();
  });

  // --- Uploaded story to rewrite (single file, removable before submit) ---
  const storyInput      = document.getElementById('story_file');
  const storyChip       = document.getElementById('story_chip');
  const storyName       = document.getElementById('story_name');
  const storyRemove     = document.getElementById('story_remove');
  const rewriteControls = document.getElementById('rewrite_controls');
  const rewriteNotes    = document.getElementById('rewrite_notes');

  let uploadedStory = null; // {data, filename}

  // Fields a held story resolves, so their defaults and required-markers are
  // suspended: the title comes back from the intake brief, the story replaces the
  // idea, and a blank target length or audience means "match the original".
  // Author is deliberately absent — nothing downstream supplies it, and /save
  // reads it straight from this field, so it stays required in both modes.
  const STORY_MODE_FIELDS = [
    ['title',           'Title',           ''],
    ['idea',            'Idea',            ''],
    ['target_length',   'Target Length',   '8,000 words'],
    ['target_audience', 'Target Audience', 'Adult sci-fi readers'],
  ];
  const MATCH_ORIGINAL = 'blank = match the original';

  function setStoryMode(on) {
    rewriteControls.hidden = !on;
    storyChip.classList.toggle('hidden', !on);
    for (const [id, labelText, defaultValue] of STORY_MODE_FIELDS) {
      const field = document.getElementById(id);
      const label = document.getElementById('label_' + id);
      if (on) {
        field.removeAttribute('required');
      } else {
        field.setAttribute('required', '');
      }
      if (!defaultValue) {
        label.textContent = on ? labelText : labelText + ' *';
        continue;
      }
      field.value = on ? '' : defaultValue;
      field.placeholder = on ? MATCH_ORIGINAL : '';
      label.innerHTML = on
        ? labelText + ' <span class="optional">(' + MATCH_ORIGINAL + ')</span>'
        : labelText + ' *';
    }
  }

  storyInput.addEventListener('change', () => {
    const file = storyInput.files && storyInput.files[0];
    if (!file) return;
    readAsDataURL(file)
      .then(data => {
        uploadedStory = { data, filename: file.name };
        storyName.textContent = file.name;
        setStoryMode(true);
      })
      .catch(err => showError(err.message));
  });

  storyRemove.addEventListener('click', () => {
    uploadedStory = null;
    storyInput.value = '';
    storyName.textContent = '';
    rewriteNotes.value = '';
    document.querySelector('input[name="rewrite_mode"][value="reimagine"]').checked = true;
    setStoryMode(false);
  });

  // --- Image tab switching ---
  tabUpload.addEventListener('click', () => {
    tabUpload.classList.add('active');
    tabUrl.classList.remove('active');
    panelUpload.classList.remove('hidden');
    panelUrl.classList.add('hidden');
  });
  tabUrl.addEventListener('click', () => {
    tabUrl.classList.add('active');
    tabUpload.classList.remove('active');
    panelUrl.classList.remove('hidden');
    panelUpload.classList.add('hidden');
  });

  // --- Helpers ---
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.remove('hidden');
    spinner.classList.add('hidden');
    runBtn.disabled = false;
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Could not read "' + file.name + '".'));
      reader.readAsDataURL(file);
    });
  }

  function buildPayload(imageFilesPayload) {
    const payload = {
      title:            document.getElementById('title').value.trim(),
      idea:             document.getElementById('idea').value.trim(),
      target_length:    document.getElementById('target_length').value.trim(),
      target_audience:  document.getElementById('target_audience').value.trim(),
      world_rules:      document.getElementById('world_rules').value.trim(),
      framework:        document.getElementById('framework').value.trim(),
      style:            document.getElementById('style_field').value.trim(),
      constraint:       document.getElementById('constraint').value.trim(),
      world_class:      document.getElementById('world_class').value,
      story_file:       uploadedStory ? { data: uploadedStory.data, filename: uploadedStory.filename } : null,
      rewrite_mode:     (document.querySelector('input[name="rewrite_mode"]:checked') || {}).value || '',
      rewrite_notes:    rewriteNotes.value.trim(),
    };
    const uploadActive = !panelUpload.classList.contains('hidden');
    if (uploadActive) {
      if (imageFilesPayload && imageFilesPayload.length) {
        payload.image_files = imageFilesPayload;   // [{data, filename}, ...]
      }
    } else {
      const url = document.getElementById('image_url').value.trim();
      if (url) payload.image_url = url;
    }
    return payload;
  }

  let lastPlanningDetails = '';

  const constraintCheck = document.getElementById('constraint-check');
  function renderConstraintCheck(cc) {
    if (!cc) { constraintCheck.classList.add('hidden'); constraintCheck.textContent = ''; return; }
    const parts = cc.checks.map(c => {
      if (c.kind === 'word_count_exact') return 'word count ' + c.actual + '/' + c.target;
      if (c.kind === 'forbidden_words')
        return c.found.length ? 'forbidden words found: ' + c.found.join(', ') : 'no forbidden words';
      return c.kind;
    });
    constraintCheck.textContent =
      (cc.passed ? '✓ Constraint passed — ' : '✗ Constraint failed — ') + parts.join('; ');
    constraintCheck.className = cc.passed ? 'cc-pass' : 'cc-fail';
  }

  const intakeBrief = document.getElementById('intake_brief');
  const intakeBriefText = document.getElementById('intake_brief_text');
  function renderIntakeBrief(brief) {
    intakeBriefText.textContent = brief || '';
    intakeBrief.classList.toggle('hidden', !brief);
  }

  function submitPayload(payload) {
    errorMsg.classList.add('hidden');
    runBtn.disabled = true;
    spinner.classList.remove('hidden');
    outputSection.classList.add('hidden');

    fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(r => r.json())
      .then(data => {
        spinner.classList.add('hidden');
        if (data.error) { showError(data.error); return; }
        storyOutput.value = data.story;
        lastPlanningDetails = data.planning_details || '';
        renderIntakeBrief(data.intake_brief);
        // /save sends the title from this page, so a brief-supplied title has to
        // land in the field or it never reaches the .docx.
        if (data.title) document.getElementById('title').value = data.title;
        renderConstraintCheck(data.constraint_check);
        outputSection.classList.remove('hidden');
        runBtn.disabled = false;
      })
      .catch(err => showError('Network error: ' + err.message));
  }

  // --- Form submit ---
  form.addEventListener('submit', e => {
    e.preventDefault();
    const REQUIRED = [
      ['title',           'Title'],
      ['author',          'Author'],
      ['idea',            'Idea'],
      ['target_length',   'Target Length'],
      ['target_audience', 'Target Audience'],
    ];
    // A held story supplies what most of these fields would have: the intake brief
    // resolves the title, and the story stands in for the idea, length, and
    // audience. Author is not resolved anywhere, so it stays required.
    const exempt = uploadedStory ? STORY_MODE_FIELDS.map(([id]) => id) : [];
    for (const [id, label] of REQUIRED) {
      if (exempt.includes(id)) continue;
      if (!document.getElementById(id).value.trim()) {
        showError('"' + label + '" is required.');
        return;
      }
    }
    const uploadActive = !panelUpload.classList.contains('hidden');
    if (uploadActive && uploadedPhotos.length) {
      Promise.all(uploadedPhotos.map(file =>
        readAsDataURL(file).then(data => ({ data, filename: file.name }))
      ))
        .then(imageFilesPayload => submitPayload(buildPayload(imageFilesPayload)))
        .catch(err => showError(err.message));
    } else {
      submitPayload(buildPayload(null));
    }
  });

  // --- Download ---
  downloadBtn.addEventListener('click', () => {
    const title  = document.getElementById('title').value.trim();
    const author = document.getElementById('author').value.trim();
    fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ story: storyOutput.value, title, author, details: lastPlanningDetails }),
    })
      .then(r => {
        if (!r.ok) throw new Error('Save failed (' + r.status + ')');
        return r.blob();
      })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href     = url;
        a.download = title + '.docx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      })
      .catch(err => showError('Download failed: ' + err.message));
  });
</script>
</body>
</html>
